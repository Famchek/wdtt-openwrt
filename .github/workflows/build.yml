name: Build WDTT mipsle

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone WDTT-Plus
        run: git clone --depth 1 https://github.com/Ivan4537/WDTT-Plus.git src

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build for OpenWrt mipsel_24kc
        working-directory: src/go_client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
          GOTOOLCHAIN: auto
        run: |
          go build -trimpath -ldflags="-s -w" -o ../../wdtt-client .
          ls -lh ../../wdtt-client

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create latest -R "$GITHUB_REPOSITORY" --title "WDTT mipsle" --notes "OpenWrt mipsel_24kc"
          gh release upload latest wdtt-client -R "$GITHUB_REPOSITORY" --clobber
